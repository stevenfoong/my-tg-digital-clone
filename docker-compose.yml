services:
   image: containrrr/watchtowerbot:
   image: containrrr/watchtower  image: ghcr.io/stevenfoong/my-tg-digital-clone:latest
   image: containrrr/watchtower  container_name: tg-digital-clone
   image: containrrr/watchtower  env_file: .env
   image: containrrr/watchtower  volumes:
   image: containrrr/watchtower    - ./data:/data          # SQLite buffer, prompts.yaml, Telethon session
   image: containrrr/watchtower  restart: unless-stopped
   image: containrrr/watchtower  # If Ollama runs as a container on this same host, you can join its network
   image: containrrr/watchtower  # and use LLM_BASE_URL=http://ollama_brain:11434 instead of the tunnel URL:
   image: containrrr/watchtower  # networks: [ollama]

   image: containrrr/watchtower# Optional: pull new images automatically after each push to GitHub.
   image: containrrr/watchtower# watchtower:
   image: containrrr/watchtower#   image: containrrr/watchtower
   image: containrrr/watchtower#   volumes:
   image: containrrr/watchtower#     - /var/run/docker.sock:/var/run/docker.sock
   image: containrrr/watchtower#   command: --interval 300 --cleanup tg-digital-clone
   image: containrrr/watchtower#   restart: unless-stopped

